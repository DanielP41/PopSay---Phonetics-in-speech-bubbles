name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias de armado
        run: pip install numpy cmudict kokoro-onnx ziglang pydantic-settings fastapi httpx

      - name: Núcleo (modelo, voces, IPA)
        run: python tools/build_core.py

      - name: Armar carpeta portable
        run: python tools/build_portable_windows.py

      - name: Autodiagnóstico con el Python incluido (Windows real)
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        working-directory: dist/PopSay/app
        # El runner no tiene placa de sonido: ese único chequeo puede fallar.
        run: |
          ..\runtime\python.exe -E -s -X utf8 -m popsay.selftest
          ..\runtime\python.exe -E -s -X utf8 -c "from popsay.engine import Engine; e=Engine(); e.start().result(); s=e.synthesize('Hello world.','af_heart','en-US',1.0).result(); assert s.duration > 0.5; print('voz OK', round(s.duration,2))"

      - uses: actions/upload-artifact@v4
        with:
          name: PopSay-windows-portable
          path: dist/PopSay-windows-portable.zip
          compression-level: 0
          retention-days: 30

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install numpy cmudict kokoro-onnx
      - run: python tools/build_core.py
      - working-directory: extension
        run: |
          npm ci
          npm run build
          npm test
      - run: python tools/build_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: popsay-extension
          path: dist/popsay-extension-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-portable, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: PopSay ${{ github.ref_name }}
          files: assets/*.zip
          body: |
            ## Descargas

            **🪟 App portable de Windows: `PopSay-windows-portable.zip`**
            Funciona en cualquier programa (Word, PDF, Telegram, navegador…) y sin internet.
            1. Descomprimí el zip donde quieras (sirve desde un pendrive).
            2. Abrí `PopSay.exe`: aparece un ícono azul en la bandeja del sistema.
            3. Seleccioná texto en inglés y presioná **Alt+Shift+P**, o tocá el iconito azul que aparece junto al mouse.

            Si Windows muestra un aviso de SmartScreen: **Más información → Ejecutar de todas formas**.

            **🧩 Extensión de Chrome / Edge: `popsay-extension-*.zip`**
            1. Descomprimí el zip en una carpeta fija.
            2. Abrí `chrome://extensions` (o `edge://extensions`) y activá el **Modo de desarrollador**.
            3. **Cargar descomprimida** → elegí la carpeta donde está `manifest.json`.

            ## Qué hace
            Seleccionás texto en inglés y una burbuja lo pronuncia con voz neuronal (Kokoro-82M), muestra el IPA y resalta palabra y sílaba mientras suena. Acento US o UK, velocidad y repetición en bucle. Todo corre en tu compu: ningún texto sale a internet.
